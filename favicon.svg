<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="pawGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="100%" style="stop-color:#F7931E"/>
    </linearGradient>
  </defs>
  <!-- Main pad -->
  <ellipse cx="32" cy="44" rx="16" ry="14" fill="url(#pawGradient)"/>
  <!-- Toe 1 - far left -->
  <ellipse cx="12" cy="24" rx="7" ry="9" transform="rotate(-20 12 24)" fill="url(#pawGradient)"/>
  <!-- Toe 2 - inner left -->
  <ellipse cx="24" cy="16" rx="6" ry="8" transform="rotate(-10 24 16)" fill="url(#pawGradient)"/>
  <!-- Toe 3 - inner right -->
  <ellipse cx="40" cy="16" rx="6" ry="8" transform="rotate(10 40 16)" fill="url(#pawGradient)"/>
  <!-- Toe 4 - far right -->
  <ellipse cx="52" cy="24" rx="7" ry="9" transform="rotate(20 52 24)" fill="url(#pawGradient)"/>
</svg>
